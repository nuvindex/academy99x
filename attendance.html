<style>
body {
  background: linear-gradient(135deg, #0b1120 0%, #0f1a2e 50%, #0b1120 100%);
  min-height: 100vh;
}
.main-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 30px 20px 80px;
}
.page-header {
  margin-bottom: 28px;
  animation: fadeIn 0.6s ease;
}
.page-header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 4px;
}
.page-header p {
  font-size: 0.9rem;
  color: #64748b;
}
.filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 20px;
}
.students-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  animation: fadeInUp 0.5s ease;
}
.att-card {
  background: rgba(22, 30, 49, 0.85);
  border: 2px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 18px 14px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  user-select: none;
  min-height: 140px;
  justify-content: center;
}
.att-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
}
.att-card .card-seq {
  font-size: 0.72rem;
  font-weight: 700;
  color: #94a3b8;
  background: rgba(255, 255, 255, 0.05);
  padding: 2px 12px;
  border-radius: 20px;
  font-family: monospace;
}
.att-card .card-name {
  font-size: 0.95rem;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.3;
}
.att-card .card-phone {
  font-size: 0.7rem;
  padding: 2px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.att-card .card-status {
  font-size: 0.85rem;
  font-weight: 800;
  padding: 4px 18px;
  border-radius: 20px;
  margin-top: 4px;
}
.att-card.status-present {
  border-color: rgba(16, 185, 129, 0.5);
  background: rgba(16, 185, 129, 0.08);
}
.att-card.status-present .card-status {
  background: rgba(16, 185, 129, 0.2);
  color: #10b981;
}
.att-card.status-late {
  border-color: rgba(245, 158, 11, 0.5);
  background: rgba(245, 158, 11, 0.08);
}
.att-card.status-late .card-status {
  background: rgba(245, 158, 11, 0.2);
  color: #f59e0b;
}
.att-card.status-absent {
  border-color: rgba(239, 68, 68, 0.5);
  background: rgba(239, 68, 68, 0.08);
}
.att-card.status-absent .card-status {
  background: rgba(239, 68, 68, 0.2);
  color: #f87171;
}
.stats-bar {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  animation: fadeIn 0.4s ease;
}
.stats-bar .stat-item {
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  padding: 10px 20px;
  font-size: 0.85rem;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 8px;
}
.stats-bar .stat-item strong {
  font-size: 1.2rem;
}
.stat-present strong { color: #10b981; }
.stat-late strong { color: #f59e0b; }
.stat-absent strong { color: #f87171; }
.stat-total strong { color: #60a5fa; }
.search-wrapper {
  position: relative;
  max-width: 380px;
  width: 100%;
}
.search-wrapper i {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #64748b;
  font-size: 0.85rem;
}
.search-wrapper input {
  padding-right: 38px;
}
.toolbar-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.report-preview {
  background: rgba(22, 30, 49, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 24px;
  margin-top: 24px;
  overflow-x: auto;
}
.report-preview table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.report-preview th {
  background: rgba(16, 185, 129, 0.15);
  color: #10b981;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  text-align: center;
  font-weight: 700;
  white-space: nowrap;
}
.report-preview td {
  padding: 8px 12px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  text-align: center;
  color: #cbd5e1;
}
.report-preview td.r-present { background: rgba(16, 185, 129, 0.12); color: #10b981; font-weight: 700; }
.report-preview td.r-late { background: rgba(245, 158, 11, 0.12); color: #f59e0b; font-weight: 700; }
.report-preview td.r-absent { background: rgba(239, 68, 68, 0.12); color: #f87171; font-weight: 700; }
.report-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: #ffffff;
  text-align: center;
  margin-bottom: 4px;
}
.report-subtitle {
  font-size: 0.85rem;
  color: #64748b;
  text-align: center;
  margin-bottom: 16px;
}
.report-stats-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.report-stats-row span {
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.05);
  padding: 6px 16px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  color: #94a3b8;
}
.report-stats-row .rp-green { color: #10b981; }
.report-stats-row .rp-amber { color: #f59e0b; }
.report-stats-row .rp-red { color: #f87171; }
.report-stats-row .rp-blue { color: #60a5fa; }
@media (max-width: 992px) {
  .students-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
  .main-content { padding: 20px 12px 100px; }
  .students-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .att-card { min-height: 120px; padding: 14px 10px; }
  .filter-grid { grid-template-columns: 1fr; padding: 12px; }
  .toolbar-row { flex-direction: column; align-items: stretch; }
  .search-wrapper { max-width: 100%; }
}
@media (max-width: 480px) {
  .students-grid { grid-template-columns: 1fr; }
  .stats-bar { justify-content: center; }
  .stats-bar .stat-item { padding: 8px 14px; font-size: 0.78rem; }
}
</style>

  <div id="studentsGridContainer" class="students-grid">

<script>
(function(){
  const s = JSON.parse(localStorage.getItem('adminSession'));
  if (!s || s.role !== 'admin' || (Date.now() - s.timestamp > 86400000)) {
    localStorage.removeItem('adminSession');
    window.location.href = 'login.html?mode=admin';
  }
})();
function logout() { localStorage.removeItem('adminSession'); window.location.href = 'index.html'; }
const firebaseConfig = {
  apiKey: "AIzaSyBfJgQDKE0IBWnP6De30-9MwYc0mty7Obs",
  authDomain: "adawra-63958.firebaseapp.com",
  databaseURL: "https://adawra-63958-default-rtdb.firebaseio.com",
  projectId: "adawra-63958"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();


const periodMap = {
  prep: [
    { value: "period1", label: "الفترة الأولى" },
    { value: "period2", label: "الفترة الثانية" },
    { value: "period3", label: "الفترة الثالثة" }
  ],
  adults: [
    { value: "thursday", label: "يوم الخميس" },
    { value: "friday", label: "يوم الجمعة" }
  ],
  kids: [
    { value: "morning", label: "صباحي" },
    { value: "evening", label: "مسائي" }
  ],
  institute: [
    { value: "level1", label: "مستوى أول" },
    { value: "level2", label: "مستوى ثاني" }
  ]
};

let studentsList = [];
let attendanceMap = {};
let currentGeneratedHTML = "";

function showMessage(msg) {
  const modal = document.getElementById('messageModal');
  document.getElementById('messageText').textContent = msg;
  modal.classList.add('show');
  setTimeout(() => modal.classList.remove('show'), 2500);
}

function onCourseChange() {
  closeReport();
  clearAll();
  loadGroups();
  updatePeriods();
}

function clearAll() {
  document.getElementById("studentsGridContainer").innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#64748b;">اختر الدورة والفرقة ثم اضغط "تحميل الطلاب"</div>';
  document.getElementById("statsBar").style.display = "none";
  document.getElementById("toolbarRow").style.display = "none";
  document.getElementById("actionBar").style.display = "none";
  studentsList = [];
  attendanceMap = {};
}

function loadGroups() {
  const courseId = document.getElementById("courseSelect").value;
  const select = document.getElementById("groupSelect");
  if (!courseId) {
    select.innerHTML = '<option value="">-- اختر الدورة أولاً --</option>';
    return;
  }
  select.innerHTML = '<option value="">⏳ جاري التحميل...</option>';
  db.ref("2026/groups/" + courseId).once("value", snap => {
    select.innerHTML = '<option value="">-- اختر الفرقة --</option>';
    if (!snap.exists()) {
      select.innerHTML = '<option value="">⚠️ لا توجد فرق مسجلة</option>';
      return;
    }
    snap.forEach(child => {
      const opt = document.createElement("option");
      opt.value = child.key;
      opt.textContent = child.val().name || child.key;
      select.appendChild(opt);
    });
  }).catch(() => {
    select.innerHTML = '<option value="">❌ فشل التحميل</option>';
  });
}

function updatePeriods() {
  const courseId = document.getElementById("courseSelect").value;
  const periodSelect = document.getElementById("periodSelect");
  if (!courseId || !periodMap[courseId]) {
    periodSelect.innerHTML = '<option value="">-- اختر الدورة أولاً --</option>';
    return;
  }
  periodSelect.innerHTML = "";
  periodMap[courseId].forEach(p => {
    const opt = document.createElement("option");
    opt.value = p.value;
    opt.textContent = p.label;
    periodSelect.appendChild(opt);
  });
}

async function loadAttendanceGrid() {
  const courseId = document.getElementById("courseSelect").value;
  const groupId = document.getElementById("groupSelect").value;
  const weekId = document.getElementById("weekSelect").value;
  const periodId = document.getElementById("periodSelect").value;

  if (!courseId || !groupId || !weekId || !periodId) {
    showMessage("⚠️ يرجى اختيار جميع الفلاتر أولاً");
    return;
  }

  const container = document.getElementById("studentsGridContainer");
  container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#64748b;"><i class="fas fa-spinner fa-pulse" style="font-size:1.5rem;display:block;margin-bottom:10px;"></i> جاري تحميل بيانات الطلاب...</div>';
  closeReport();

  try {
    const studentsSnap = await db.ref("2026/students/" + courseId + "/" + groupId).once("value");
    if (!studentsSnap.exists()) {
      container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#f87171;">📋 لا يوجد طلاب مسجلين في هذه الفرقة</div>';
      return;
    }

    const attSnap = await db.ref("2026/attendance/" + courseId + "/" + groupId + "/" + weekId + "/" + periodId).once("value");
    const savedAtt = attSnap.exists() ? attSnap.val() : {};

    studentsList = [];
    attendanceMap = {};

    studentsSnap.forEach(child => {
      studentsList.push({ id: child.key, ...child.val() });
    });
    studentsList.sort((a, b) => (a.seq || 0) - (b.seq || 0));

    studentsList.forEach(s => {
      attendanceMap[s.id] = savedAtt[s.id] ? savedAtt[s.id].status : "present";
    });

    renderCards(studentsList);
    updateStats();
    document.getElementById("statsBar").style.display = "flex";
    document.getElementById("toolbarRow").style.display = "flex";
    document.getElementById("actionBar").style.display = "flex";

    container.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#f87171;">❌ فشل تحميل البيانات: ' + e.message + '</div>';
  }
}

function renderCards(list) {
  const container = document.getElementById("studentsGridContainer");
  if (list.length === 0) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#64748b;">لا توجد نتائج مطابقة للبحث</div>';
    return;
  }
  container.innerHTML = "";
  list.forEach(s => {
    const status = attendanceMap[s.id] || "present";
    const card = document.createElement("div");
    card.className = "att-card status-" + status;
    card.id = "card_" + s.id;
    card.onclick = () => cycleStatus(s.id);

    let phoneLabel = s.phone ? '📞 ' + s.phone : 'لا يوجد هاتف';
    let phoneClass = s.phone ? '' : 'opacity-50';

    let statusText = { present: "حاضر", late: "متأخر", absent: "غائب" }[status] || "حاضر";

    card.innerHTML =
      '<div class="card-seq">مسلسل: ' + (s.seq || '-') + '</div>' +
      '<div class="card-name">' + (s.name || '') + '</div>' +
      '<div class="card-phone ' + phoneClass + '">' + phoneLabel + '</div>' +
      '<div class="card-status">' + statusText + '</div>';

    container.appendChild(card);
  });
}

function cycleStatus(studentId) {
  const current = attendanceMap[studentId] || "present";
  const next = current === "present" ? "late" : current === "late" ? "absent" : "present";
  attendanceMap[studentId] = next;

  const card = document.getElementById("card_" + studentId);
  if (card) {
    card.className = "att-card status-" + next;
    const statusEl = card.querySelector(".card-status");
    if (statusEl) statusEl.textContent = { present: "حاضر", late: "متأخر", absent: "غائب" }[next];
  }
  updateStats();
}

function resetAllToPresent() {
  if (!confirm("هل تريد إعادة تعيين حالة جميع الطلاب إلى (حاضر)؟")) return;
  studentsList.forEach(s => { attendanceMap[s.id] = "present"; });
  renderCards(studentsList);
  updateStats();
}

function updateStats() {
  let total = studentsList.length;
  let present = 0, late = 0, absent = 0;
  Object.values(attendanceMap).forEach(st => {
    if (st === "present") present++;
    else if (st === "late") late++;
    else if (st === "absent") absent++;
  });
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statPresent").textContent = present;
  document.getElementById("statLate").textContent = late;
  document.getElementById("statAbsent").textContent = absent;
}

function filterCards() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) { renderCards(studentsList); return; }
  const filtered = studentsList.filter(s =>
    (s.name || "").toLowerCase().includes(q) ||
    (s.seq || "").toString() === q
  );
  renderCards(filtered);
}

async function saveAttendance() {
  const courseId = document.getElementById("courseSelect").value;
  const groupId = document.getElementById("groupSelect").value;
  const weekId = document.getElementById("weekSelect").value;
  const periodId = document.getElementById("periodSelect").value;
  if (!courseId || !groupId) { showMessage("⚠️ اختر الدورة والفرقة أولاً"); return; }

  const data = {};
  const now = new Date().toLocaleString("ar-EG");
  Object.keys(attendanceMap).forEach(sid => {
    data[sid] = { status: attendanceMap[sid], lastUpdated: now };
  });

  try {
    await db.ref("2026/attendance/" + courseId + "/" + groupId + "/" + weekId + "/" + periodId).set(data);
    showMessage("✅ تم حفظ كشف الحضور بنجاح في Firebase");
  } catch (e) {
    showMessage("❌ فشل الحفظ: " + e.message);
  }
}

async function deleteSheet() {
  const courseId = document.getElementById("courseSelect").value;
  const groupId = document.getElementById("groupSelect").value;
  const weekId = document.getElementById("weekSelect").value;
  const periodId = document.getElementById("periodSelect").value;
  if (!courseId || !groupId) { showMessage("⚠️ اختر الدورة والفرقة أولاً"); return; }
  if (!confirm("⚠️ هل أنت متأكد من حذف كشف الحضور هذا بالكامل؟")) return;

  try {
    await db.ref("2026/attendance/" + courseId + "/" + groupId + "/" + weekId + "/" + periodId).remove();
    showMessage("🗑️ تم حذف الكشف بنجاح");
    loadAttendanceGrid();
  } catch (e) {
    showMessage("❌ فشل الحذف: " + e.message);
  }
}

function generateReport() {
  if (studentsList.length === 0) { showMessage("⚠️ لا توجد بيانات لإنشاء التقرير"); return; }

  const courseId = document.getElementById("courseSelect").value;
  const groupSelect = document.getElementById("groupSelect");
  const weekSelect = document.getElementById("weekSelect");
  const periodSelect = document.getElementById("periodSelect");
  const groupName = groupSelect.options[groupSelect.selectedIndex]?.text || "";
  const weekName = weekSelect.options[weekSelect.selectedIndex]?.text || "";
  const periodName = periodSelect.options[periodSelect.selectedIndex]?.text || "";

  let total = studentsList.length;
  let present = 0, late = 0, absent = 0;
  Object.values(attendanceMap).forEach(st => {
    if (st === "present") present++;
    else if (st === "late") late++;
    else if (st === "absent") absent++;
  });
  const rate = total > 0 ? Math.round((present / total) * 100) : 0;

  let rows = "";
  studentsList.forEach(s => {
    const status = attendanceMap[s.id] || "present";
    let stText = "حاضر", stClass = "r-present";
    if (status === "late") { stText = "متأخر"; stClass = "r-late"; }
    else if (status === "absent") { stText = "غائب"; stClass = "r-absent"; }
    rows += "<tr><td>" + (s.seq || '-') + "</td><td style='text-align:right;padding-right:15px;'>" + (s.name || '') + "</td><td>" + (s.phone || 'غير مسجل') + "</td><td class='" + stClass + "'>" + stText + "</td></tr>";
  });

  const html =
    '<div class="report-title">تقرير الحضور والغياب</div>' +
    '<div class="report-subtitle">' + groupName + ' | ' + weekName + ' | ' + periodName + '</div>' +
    '<div class="report-stats-row">' +
    '<span class="rp-blue">إجمالي: ' + total + '</span>' +
    '<span class="rp-green">🟢 حاضر: ' + present + '</span>' +
    '<span class="rp-amber">🟡 متأخر: ' + late + '</span>' +
    '<span class="rp-red">🔴 غائب: ' + absent + '</span>' +
    '<span class="rp-green">نسبة الحضور: ' + rate + '%</span>' +
    '</div>' +
    '<table><thead><tr><th>المسلسل</th><th>اسم الطالب</th><th>رقم الجوال</th><th>الحالة</th></tr></thead><tbody>' + rows + '</tbody></table>';

  currentGeneratedHTML = html;
  document.getElementById("reportContent").innerHTML = html;
  document.getElementById("reportArea").style.display = "block";
  document.getElementById("reportArea").scrollIntoView({ behavior: "smooth" });
}

function closeReport() {
  document.getElementById("reportArea").style.display = "none";
  currentGeneratedHTML = "";
}

function downloadExcel() {
  if (!currentGeneratedHTML) { showMessage("⚠️ أنشئ التقرير أولاً"); return; }

  const groupSelect = document.getElementById("groupSelect");
  const groupName = groupSelect.options[groupSelect.selectedIndex]?.text || "report";

  const excelContent =
    '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" lang="ar" dir="rtl">' +
    '<head><meta charset="UTF-8"><style>' +
    'body{direction:rtl;font-family:Arial,sans-serif;}' +
    '.report-title{font-size:16pt;font-weight:bold;text-align:center;color:#064e3b;}' +
    '.report-subtitle{font-size:11pt;text-align:center;color:#475569;}' +
    'table{width:100%;border-collapse:collapse;}' +
    'th{background:#0f172a;color:white;border:1px solid #cbd5e1;padding:8px;text-align:center;}' +
    'td{border:1px solid #cbd5e1;padding:6px;text-align:center;}' +
    '.r-present{background:#dcfce7;color:#15803d;font-weight:bold;}' +
    '.r-late{background:#fef3c7;color:#b45309;font-weight:bold;}' +
    '.r-absent{background:#fee2e2;color:#b91c1c;font-weight:bold;}' +
    '</style></head><body>' + currentGeneratedHTML + '</body></html>';

  const blob = new Blob([excelContent], { type: 'application/vnd.ms-excel;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.setAttribute("download", "تقرير_حضور_" + groupName + "_2026.xls");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
function toggleNav() {
  var nl = document.querySelector('.nav-links');
  var no = document.querySelector('.nav-overlay');
  var nt = document.querySelector('.nav-toggle');
  if (nl) nl.classList.toggle('open');
  if (no) no.classList.toggle('show');
  if (nt) nt.classList.toggle('open');
}
